build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 60
    # Compose UI builders are declaratively long; splitting them purely to satisfy a
    # line count adds indirection without value.
    ignoreAnnotated: ['Composable', 'Preview']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    # Composables legitimately take state + many callbacks.
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Repository / DAO facade interfaces expose many typed accessors by design.
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by official Compose convention.
    ignoreAnnotated: ['Composable', 'Preview']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateMember:
    # @Preview functions are entry points for tooling, not dead code.
    ignoreAnnotated: ['Preview']
  WildcardImport:
    # Allowed project-wide (kept consistent with ktlint's no-wildcard-imports being
    # disabled in .editorconfig). Compose APIs are large and wildcard-friendly.
    active: false
