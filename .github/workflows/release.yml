name: Release

# MANUAL re-publish tool only. The normal release is built and published by ci.yml's
# `release` job in the same run as the merge (APK + GitHub Release, no PAT needed).
# This workflow exists to RE-build/RE-publish a specific existing tag on demand —
# run it via "Run workflow" against the tag ref. It deliberately does NOT trigger on
# tag push, so it can never double-publish against ci.yml.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight release

env:
  JAVA_VERSION: "21"
  # Daemon on: keeps a warm JVM across the build's multiple Gradle tasks in this run.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  release:
    name: "Build & Publish Release"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # needed to create GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      # ── Detect which app this tag is for ────────────────────────────────
      - name: Resolve app from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == dhruv-finance-* ]]; then
            echo "app=finance"   >> "$GITHUB_OUTPUT"
            echo "module=:apps:finance:app" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == dhruv-tools-* ]]; then
            echo "app=tools"     >> "$GITHUB_OUTPUT"
            echo "module=:apps:tools:app"   >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == dhruv-vault-* ]]; then
            echo "app=vault"     >> "$GITHUB_OUTPUT"
            echo "module=:apps:vault:app"   >> "$GITHUB_OUTPUT"
          fi
          VERSION="${TAG#dhruv-*-}"          # strip prefix → "v1.2.0"
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"

      # ── Build environment ────────────────────────────────────────────────
      # No test re-run here: the `dhruv-*-v*` tag is created by ci.yml's
      # version-bump job only AFTER Gate 3 (tests + ArchUnit) passed on this exact
      # commit. Re-running them would be pure duplication. Build + sign + publish only.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      # ── Build signed APK ─────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/upload-key.jks"

      - name: Assemble release APK
        run: ./gradlew ${{ steps.tag.outputs.module }}:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.tag.outputs.version }}

      # ── Locate APK ───────────────────────────────────────────────────────
      - name: Find APK
        id: apk
        run: |
          APP="${{ steps.tag.outputs.app }}"
          DIR="apps/$APP/app/build/outputs/apk/release"
          # Prefer a signed APK; never pick a *-unsigned.apk.
          APK=$(find "$DIR" -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No signed release APK found in $DIR" >&2
            find "$DIR" -name "*.apk" -printf '  present: %p\n' 2>/dev/null || true
            exit 1
          fi
          FILENAME="dhruv-${APP}-${{ steps.tag.outputs.version }}-release.apk"
          mv "$APK" "$FILENAME"
          echo "path=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "name=$FILENAME" >> "$GITHUB_OUTPUT"

      # ── Generate changelog ────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep "dhruv-${{ steps.tag.outputs.app }}-v" | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)")
          fi
          {
            echo "changelog<<EOF"
            echo "## What's changed"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Dhruv ${{ steps.tag.outputs.app }} ${{ steps.tag.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
