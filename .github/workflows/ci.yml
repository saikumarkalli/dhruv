name: CI

on:
  # Feature branches (feat/**, fix/**, chore/**) are validated via their PR below,
  # not on push — pushing a branch that already has an open PR would otherwise run
  # the pipeline twice (once per event) on the same commit.
  #
  # NOTE: no `paths-ignore`. With branch protection + required status checks, a push
  # that touches only ignored paths leaves the required checks permanently "pending"
  # and blocks the merge. Docs-only skipping is instead done by the `changes` gate job
  # below — a job skipped via `if:` reports as "skipped" (counts as passing), whereas
  # `paths-ignore` never creates the check run at all (ADR-0026).
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Concurrency: cancel superseded PR runs (saves minutes during iteration), but NEVER
# cancel a push to a protected branch — each merge to develop/main must run to
# completion so it produces its version bump and release tag. A cancelled run marks
# the `release` job as skipped, which is the "cancelled + release skipped after
# merge" failure mode this guards against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs that need more elevate locally.
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  # gradle.properties keeps workers.max=4 for dev machines. GitHub-hosted standard
  # runners on a private repo are 2-core/7 GB, so four workers just thrash. Overridden
  # here (CI only) — the daemon and configuration cache settings stay as configured.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"

jobs:
  # ── Gate 0: Changed-path filter ───────────────────────────────────────────
  # Docs-only changes skip the build gates AND the release (ADR-0026). This is a
  # JOB, not trigger-level `paths-ignore`: a job skipped via `if:` reports as
  # "skipped", which branch protection counts as passing, whereas `paths-ignore`
  # never creates the check run at all and leaves required checks pending forever.
  #
  # Only `docs/**`, any nested `*/docs/**`, and `**/*.md` count as docs.
  # `platform/versions.json` and the feature-flag JSON are CODE — they feed the build.
  changes:
    name: "Gate 0 · Changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # NO CHECKOUT on purpose. This job runs on EVERY event — including the docs-only
      # ones it exists to make cheap — so a clone here would eat the saving it creates.
      # The compare API returns the changed-file list directly, in ~2s.
      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BASE"; HEAD="$GITHUB_SHA"
          fi

          FILES=""
          COUNT=0
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(gh api "repos/$GITHUB_REPOSITORY/compare/${BASE}...${HEAD}" \
                      --jq '.files[].filename' 2>/dev/null || echo "")
            COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
          fi

          # Fail safe 1: unresolvable range (new branch, force push, API error) → run everything.
          if [ -z "$FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No resolvable file list — treating as code."
            exit 0
          fi

          # Fail safe 2: the compare API caps `.files` at 300 entries. At the cap the list may be
          # truncated and a code file could sit past the boundary — never skip on a list we
          # cannot trust.
          if [ "$COUNT" -ge 300 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "File list hit the 300-entry API cap — treating as code."
            exit 0
          fi

          CODE=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*/docs/*|*.md) ;;
              *) CODE=true; echo "code change: $f"; break ;;
            esac
          done <<< "$FILES"

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Changed files: $(printf '%s\n' "$FILES" | wc -l) · code=$CODE"

  # ── Gate 1: Static analysis ────────────────────────────────────────────────
  static-analysis:
    name: "Gate 1 · Static Analysis"
    runs-on: ubuntu-latest
    needs: [ changes ]
    # PR is the ONLY full-validation pass (ADR-0026). The merge push re-runs nothing:
    # required up-to-date branches guarantee the merged tree is the tree the PR validated.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # ktlint binary is downloaded directly (no third-party action dependency) and
      # cached by version so it is fetched once, not on every run.
      - name: Cache ktlint
        id: ktlint-cache
        uses: actions/cache@v4
        with:
          path: ktlint
          key: ktlint-1.5.0

      - name: Download ktlint
        if: steps.ktlint-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint

      - name: Ensure ktlint is executable
        run: chmod +x ktlint

      # Fails the job (non-zero exit) on any style violation.
      - name: ktlint check
        run: |
          ./ktlint \
            --reporter=plain \
            --reporter=checkstyle,output=build/reports/ktlint/ktlint.xml \
            "apps/**/*.kt" "libs/**/*.kt" "build-logic/src/**/*.kt" "!**/build/**"

      # No --continue: first detekt violation fails the step immediately.
      - name: Detekt
        run: ./gradlew detekt

      # Lint runs on the debug variant; non-zero exit on errors (not warnings).
      - name: Android Lint
        run: ./gradlew :apps:finance:app:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          retention-days: 7
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt/*.html
            build/reports/ktlint/ktlint.xml

  # ── Gate 2: Security scan (GitLeaks) ──────────────────────────────────────
  # GitLeaks is the BLOCKING secret gate — fast, gates the build. OWASP now runs
  # on a schedule in owasp-scheduled.yml, off the merge path entirely (ADR-0026).
  security:
    name: "Gate 2 · Security"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ changes ]
    # No changes-gate here on purpose: secrets hide in markdown too, so GitLeaks
    # runs on docs-only PRs as well.
    if: github.event_name == 'pull_request'
    # gitleaks-action posts a PR summary comment; without these it fails on PR
    # events with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitLeaks needs full history

      # Hard failure on any detected secret — no continue-on-error.
      - name: GitLeaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 3: Tests ─────────────────────────────────────────────────────────
  tests:
    name: "Gate 3+4 · Tests + ArchUnit + Coverage + Build"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes ]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    # Exposed to the pr-summary comment and the release notes (see Post-build jobs).
    outputs:
      tests_total: ${{ steps.summary.outputs.tests_total }}
      tests_passed: ${{ steps.summary.outputs.tests_passed }}
      tests_failed: ${{ steps.summary.outputs.tests_failed }}
      tests_skipped: ${{ steps.summary.outputs.tests_skipped }}
      coverage_pct: ${{ steps.summary.outputs.coverage_pct }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Warm the Gradle build cache for subsequent pushes to this same PR: this job
      # compiles the whole project once (regressionCheck) and assembles the debug
      # APK below on the same warm daemon.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # regressionCheck = every module's debug unit tests (ArchUnit + Robolectric live in the debug
      # variant) + the merged JaCoCo report + the coverage-floor gate. Coverage is JaCoCo, not Kover
      # (Kover's Android integration doesn't recognize AGP 9 variants — the same class of issue as
      # Hilt, ADR-0010). --continue runs all test tasks even if one fails (complete report); the job
      # still fails on any test failure OR a coverage-floor violation.
      - name: Regression suite (tests + ArchUnit + coverage floor)
        run: ./gradlew regressionCheck --continue

      # Always (re)generate the merged coverage report so the summary has data even when a test or the
      # coverage floor failed above (on failure, regressionCheck stops before the report task).
      - name: Aggregate coverage report
        if: always()
        run: ./gradlew jacocoAggregatedReport --continue

      # Parse JUnit + JaCoCo XML → GitHub Job Summary + regression-summary.md + job outputs
      # (test counts, coverage %) reused by the PR comment and the Release notes.
      - name: Build regression summary
        id: summary
        if: always()
        run: python3 scripts/ci/regression_summary.py

      - name: Upload test reports
        # always() ensures reports are uploaded even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 7
          path: "**/build/reports/tests/"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 14
          path: build/reports/jacoco/jacocoAggregatedReport/

      - name: Upload regression summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-summary
          retention-days: 7
          path: regression-summary.md

      # Gate 4, folded in (ADR-0026): regressionCheck above already compiled every
      # module, so this reuses the warm daemon + build cache instead of paying for a
      # fresh runner with a cold cache restore. The signed RELEASE build is NOT here —
      # it is built in the `release` job after the version bump.
      - name: Assemble debug APK (Gate 4)
        run: ./gradlew :apps:finance:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/finance/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ── Post-build: PR status summary (sticky comment) ────────────────────────
  # Posts/updates a single PR comment summarizing every gate's result, pass or
  # fail, so a clean run is visible too (previously only GitLeaks ever commented,
  # and only when it found a secret). Runs on pull_request only; never on push.
  pr-summary:
    name: "Post-build · PR Summary Comment"
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ static-analysis, security, tests ]
    permissions:
      pull-requests: write
    steps:
      # Mints a short-lived token for the "Dhruv CI Bot" GitHub App, so the comment
      # below is posted under that identity/avatar instead of github-actions[bot].
      # (The App's display name is "Dhruv CI Bot"; the secrets keep their DHRUV_BOT_* names.)
      # Requires the DHRUV_BOT_APP_ID / DHRUV_BOT_PRIVATE_KEY secrets (App not yet
      # installed, or secrets missing) — continue-on-error lets the script step's
      # `|| github.token` fallback below take over so commenting still works.
      - name: Mint Dhruv CI Bot token
        id: dhruv-bot
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.DHRUV_BOT_APP_ID }}
          private-key: ${{ secrets.DHRUV_BOT_PRIVATE_KEY }}

      - name: Post or update PR summary comment
        uses: actions/github-script@v7
        # Never let the comment itself block merge — e.g. a forked PR forces
        # GITHUB_TOKEN read-only regardless of the permissions block above.
        continue-on-error: true
        with:
          github-token: ${{ steps.dhruv-bot.outputs.token || github.token }}
          script: |
            const marker = '<!-- ci-pr-summary-comment -->';
            const icons = { success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' };
            const results = {
              staticAnalysis: '${{ needs.static-analysis.result }}',
              security: '${{ needs.security.result }}',
              tests: '${{ needs.tests.result }}',
            };
            const rows = [
              ['Gate 1 · Static Analysis', icons[results.staticAnalysis] ?? '❔', results.staticAnalysis],
              ['Gate 2 · Security (GitLeaks)', icons[results.security] ?? '❔', results.security],
              ['Gate 2b · OWASP', 'ℹ️', 'scheduled scan (owasp-scheduled.yml)'],
              ['Gate 3+4 · Tests + ArchUnit + Coverage + Build', icons[results.tests] ?? '❔', results.tests],
            ];
            const table = ['| Gate | Status | Result |', '|---|---|---|',
              ...rows.map(([n, i, r]) => `| ${n} | ${i} | ${r} |`)].join('\n');

            // Regression detail from the tests job outputs (empty on early failure → '?').
            const reg = {
              passed: '${{ needs.tests.outputs.tests_passed }}' || '?',
              failed: '${{ needs.tests.outputs.tests_failed }}' || '?',
              total: '${{ needs.tests.outputs.tests_total }}' || '?',
              skipped: '${{ needs.tests.outputs.tests_skipped }}' || '?',
              coverage: '${{ needs.tests.outputs.coverage_pct }}' || '?',
            };
            const failNote = (reg.failed !== '0' && reg.failed !== '?') ? `, **${reg.failed} failed**` : '';
            const regLine = `**Tests:** ${reg.passed}/${reg.total} passed${failNote}, ${reg.skipped} skipped · `
              + `**Coverage (line):** ${reg.coverage}%`;

            const overall = Object.values(results).includes('failure') ? '❌ Failing' : '✅ Passing';
            const body = [
              marker,
              `### CI Summary — ${overall}`,
              '',
              table,
              '',
              regLine,
              '',
              `_Commit: ${context.sha.substring(0, 7)} · Run: [#${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId}) · Posted by Dhruv CI Bot_`,
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
                });
              }
            } catch (err) {
              core.warning(`pr-summary: could not post/update comment: ${err.message}`);
            }

  # ── Post-build: Release (bump → build → tag → publish) ────────────────────
  # Runs only on push (not PRs) to develop/main, gated on `changes` only — the PR
  # that preceded this push is the full-validation pass (ADR-0026); required
  # up-to-date branches guarantee the merged tree is the tree the PR validated, so
  # this job does not re-run static-analysis/security/tests. Does the whole release
  # IN THIS RUN so it cannot silently half-complete:
  #   1. Derive the bump segment from commit types (ADR-0025) and bump
  #      platform/versions.json + VERSION_CODE/VERSION_NAME in gradle.properties.
  #   2. Build the SIGNED release APK *at the bumped version* (gradle reads the just-
  #      written gradle.properties), and verify it is signed and within the size budget.
  #   3. Commit the bump back with [skip ci]; create + push the dhruv-<app>-v<version> tag.
  #   4. Publish a GitHub Release with the APK attached.
  #
  # No RELEASE_TOKEN / cross-workflow trigger needed: creating a Release with the
  # default GITHUB_TOKEN works fine (the anti-recursion rule only blocks a pushed
  # tag from *triggering* another workflow, which we no longer rely on). Do NOT set
  # RELEASE_TOKEN — release.yml would then also fire on the tag and double-publish.
  release:
    name: "Post-build · Release (bump + build + publish)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes ]
    # Skip on PRs, on docs-only pushes, and on commits made by this job itself.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.code == 'true' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write  # push bump commit + tag, create GitHub Release
      actions: read    # download artifacts from the PR's CI run (cross-run fetch below)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 0. Derive the semver segment from the commit types in this push ──
      # feat: -> minor, type!:/BREAKING CHANGE -> major, else patch; main = always
      # patch (D6). Checkout above already used fetch-depth: 0, so the full range
      # is available. Logic lives in a script so it is testable locally (ADR-0025).
      - name: Determine bump type
        id: bumptype
        run: |
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            RANGE="${GITHUB_SHA}~1..${GITHUB_SHA}"
          else
            RANGE="${BASE}..${GITHUB_SHA}"
          fi
          BUMP=$(git log --format='%s%n%b' "$RANGE" | bash scripts/ci/detect_bump.sh "$GITHUB_REF_NAME")
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Range $RANGE → bump=$BUMP"

      # ── 1. Bump version files ──────────────────────────────────────────
      - name: Increment VERSION_CODE in gradle.properties
        id: bump
        run: |
          PROPS="gradle.properties"
          CURRENT=$(grep "^VERSION_CODE=" "$PROPS" 2>/dev/null | cut -d= -f2 || echo "0")
          NEW=$((CURRENT + 1))

          if grep -q "^VERSION_CODE=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW/" "$PROPS"
          else
            echo "VERSION_CODE=$NEW" >> "$PROPS"
          fi

          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE bumped: $CURRENT → $NEW"

      - name: Bump version and buildNumber in platform/versions.json
        id: version_json
        run: |
          python3 scripts/ci/bump_version.py \
            --bump "${{ steps.bumptype.outputs.bump }}" \
            --build-number "${{ steps.bump.outputs.new }}"

      - name: Update VERSION_NAME in gradle.properties
        run: |
          NEW_VERSION="${{ steps.version_json.outputs.version }}"
          PROPS="gradle.properties"
          if grep -q "^VERSION_NAME=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION/" "$PROPS"
          else
            echo "VERSION_NAME=$NEW_VERSION" >> "$PROPS"
          fi
          echo "VERSION_NAME updated to $NEW_VERSION"

      # ── 2. Build the SIGNED release APK at the bumped version ───────────
      # gradle reads VERSION_CODE/VERSION_NAME from the gradle.properties just
      # written above, so the APK carries the correct version. Built BEFORE any
      # push/tag so a build failure aborts the release cleanly (no orphan tag).
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Cache WRITER: tests no longer runs on push, so this is the only job on the
      # default branch that can populate the shared Gradle cache PRs read from.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/upload-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # The secrets plugin reads .env and silently falls back to .env.example, so a missing
      # .env does not fail the build — it produces a signed APK full of MY_* placeholders.
      # Written here, never committed (.env is gitignored), and the runner is ephemeral.
      # No value is echoed: writing them into a file keeps them out of the step log.
      - name: Write .env from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          MISSING=""
          for name in GEMINI_API_KEY SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            eval "value=\${$name}"
            [ -z "$value" ] && MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ Release secrets missing:$MISSING" >&2
            echo "Set them in Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          {
            printf 'GEMINI_API_KEY=%s\n'       "$GEMINI_API_KEY"
            printf 'SUPABASE_URL=%s\n'         "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n'    "$SUPABASE_ANON_KEY"
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
          } > .env
          echo "✅ .env written ($(wc -l < .env) keys)"

      - name: Assemble signed release APK
        run: ./gradlew :apps:finance:app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Locate + VERIFY the APK: must exist, must be signed (no *-unsigned*), must
      # be within the 50 MB budget. Failing here aborts before any tag/release, so
      # we never publish a release with a missing or unsigned APK.
      - name: Locate and verify signed APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="apps/finance/app/build/outputs/apk/release"
          APK=$(find "$DIR" -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No signed release APK found in $DIR" >&2
            find "$DIR" -name "*.apk" -printf '  present: %p\n' 2>/dev/null || true
            exit 1
          fi
          VERSION="${{ steps.version_json.outputs.version }}"
          DEST="dhruv-finance-v${VERSION}-release.apk"
          cp "$APK" "$DEST"
          SIZE_MB=$(du -m "$DEST" | cut -f1)
          echo "Release APK: $DEST (${SIZE_MB} MB)"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "❌ APK exceeds 50 MB limit (${SIZE_MB} MB)" >&2
            exit 1
          fi

          # The secrets-plugin fallback is silent, so verify the artifact itself rather than
          # trusting the build. `strings` over the APK finds the baked BuildConfig constants.
          if strings "$DEST" | grep -qE 'MY_(SUPABASE_URL|SUPABASE_ANON_KEY|GEMINI_API_KEY|GOOGLE_WEB_CLIENT_ID)'; then
            echo "❌ APK contains .env.example placeholders — real secrets were not applied." >&2
            exit 1
          fi
          echo "✅ No placeholder secrets in the APK"

          # Compare against the previous release's APK. Informational on the first release
          # (no prior asset) and never fatal on a lookup failure — a GitHub API hiccup must
          # not block a release — but a >20% jump fails, because that is a real regression.
          PREV_BYTES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName \
                         --jq '.[0].tagName // empty' 2>/dev/null \
                       | xargs -r -I{} gh release view {} --repo "$GITHUB_REPOSITORY" \
                         --json assets --jq '[.assets[] | select(.name|endswith(".apk")) | .size][0] // empty' \
                         2>/dev/null || echo "")
          NEW_BYTES=$(stat -c %s "$DEST")
          if [ -n "$PREV_BYTES" ] && [ "$PREV_BYTES" -gt 0 ]; then
            DELTA=$(( (NEW_BYTES - PREV_BYTES) * 100 / PREV_BYTES ))
            echo "APK size: $((NEW_BYTES/1048576)) MB (previous $((PREV_BYTES/1048576)) MB, ${DELTA}%)"
            if [ "$DELTA" -gt 20 ]; then
              echo "❌ APK grew ${DELTA}% over the previous release (budget: 20%)." >&2
              exit 1
            fi
          else
            echo "No previous release asset — size delta baseline established at $((NEW_BYTES/1048576)) MB"
          fi

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "✅ Signed APK verified within size budget"

      # ── 3. Commit the bump + create/push the tag ───────────────────────
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle.properties platform/versions.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping push."
            exit 0
          fi

          git commit -m "chore: auto-bump (${{ steps.bumptype.outputs.bump }}) to v${{ steps.version_json.outputs.version }} (versionCode=${{ steps.bump.outputs.new }}) [skip ci]"
          # --force-with-lease: safe push — aborts if the remote moved ahead of us
          git push --force-with-lease origin HEAD:${{ github.ref_name }}

      # Tag points at the bump commit just pushed. Idempotent: skip if it exists
      # (same version reused when develop is promoted to main → no duplicate tag).
      - name: Resolve release tag (finance)
        id: tagname
        run: echo "tag=dhruv-finance-v${{ steps.version_json.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create & push version tag (idempotent)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet || true
          TAG="${{ steps.tagname.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "↺ ${TAG} already exists — not re-tagging."
          else
            git tag -a "${TAG}" -m "Release ${TAG} (from ${{ github.ref_name }} @ ${GITHUB_SHA::7})"
            git push origin "refs/tags/${TAG}"
            echo "✅ Created and pushed ${TAG}."
          fi

      # ── 4. Attach the regression summary + coverage to the Release ──────
      # Every merge to develop/main is a push and produces a Release, so this is where the
      # merge's test totals + coverage % become durably visible (PR comments don't fire on push).
      # The artifacts were uploaded by the `tests` job earlier in THIS run; downloads are
      # best-effort so a missing artifact never blocks the release.
      # The tests job no longer runs on push (ADR-0026), so the regression summary
      # and coverage report live in the PR's CI run. Find it and pull them across.
      # Entirely best-effort: release notes degrade to the APK line if anything fails.
      - name: Locate the PR's CI run
        id: prrun
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                 --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR" ]; then
            echo "No PR associated with $GITHUB_SHA — skipping artifact fetch."
            exit 0
          fi
          HEAD_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                  --event pull_request --status success --limit 50 \
                  --json databaseId,headSha \
                  --jq "[.[] | select(.headSha==\"$HEAD_SHA\")][0].databaseId // empty")
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "PR #$PR head=$HEAD_SHA run=$RUN"

      - name: Download regression summary (from PR run)
        if: steps.prrun.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: regression-summary
          path: .ci-summary
          run-id: ${{ steps.prrun.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download coverage report (from PR run)
        if: steps.prrun.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: .ci-coverage
          run-id: ${{ steps.prrun.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compose release notes + zip coverage
        run: |
          {
            if [ -f .ci-summary/regression-summary.md ]; then
              cat .ci-summary/regression-summary.md
              echo ""
            fi
            echo "_APK: \`${{ steps.apk.outputs.path }}\`. Full HTML coverage report attached below._"
          } > release-body.md
          if [ -d .ci-coverage ]; then
            (cd .ci-coverage && zip -qr ../coverage-report.zip .) || echo "coverage zip skipped"
          fi

      # ── 5. Publish the GitHub Release ───────────────────────────────────
      # The APK's existence is already guaranteed by the verify step above, so
      # fail_on_unmatched_files is off here only so that a best-effort coverage-report.zip
      # (nice-to-have) can be absent without blocking the release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: "Dhruv finance ${{ steps.version_json.outputs.version }}"
          body_path: release-body.md
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            coverage-report.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
