name: CI

on:
  # Feature branches (feat/**, fix/**, chore/**) are validated via their PR below,
  # not on push — pushing a branch that already has an open PR would otherwise run
  # the pipeline twice (once per event) on the same commit.
  #
  # NOTE: no `paths-ignore`. With branch protection + required status checks, a push
  # that touches only ignored paths leaves the required checks permanently "pending"
  # and blocks the merge. A production pipeline must run reliably on every push/PR.
  # (To skip docs-only builds safely later, use a path-filter gate job that still
  #  reports the required status — not trigger-level paths-ignore.)
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Concurrency: cancel superseded PR runs (saves minutes during iteration), but NEVER
# cancel a push to a protected branch — each merge to develop/main must run to
# completion so it produces its build artifact, version bump, and release tag.
# A cancelled run marks its downstream jobs (build, version-bump) as skipped, which
# is the "cancelled + build skipped after merge" failure mode this guards against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs that need more elevate locally.
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  # Let gradle.properties drive parallel/caching/workers (parallel=true, caching=true,
  # workers.max=4, configuration-cache=true). Only set memory here. The daemon stays ON:
  # on a one-shot runner it keeps a warm JVM across the multiple tasks in a job.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ── Gate 1: Static analysis ────────────────────────────────────────────────
  static-analysis:
    name: "Gate 1 · Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Download ktlint binary directly — no third-party action dependency.
      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint

      # Fails the job (non-zero exit) on any style violation.
      - name: ktlint check
        run: |
          ./ktlint \
            --reporter=plain \
            --reporter=checkstyle,output=build/reports/ktlint/ktlint.xml \
            "apps/**/*.kt" "libs/**/*.kt" "build-logic/src/**/*.kt" "!**/build/**"

      # No --continue: first detekt violation fails the step immediately.
      - name: Detekt
        run: ./gradlew detekt

      # Lint runs on the debug variant; non-zero exit on errors (not warnings).
      - name: Android Lint
        run: ./gradlew :apps:finance:app:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt/*.html
            build/reports/ktlint/ktlint.xml

  # ── Gate 2: Security scan (GitLeaks) ──────────────────────────────────────
  # GitLeaks is the BLOCKING secret gate — fast, gates the build. OWASP now runs
  # on a schedule in owasp-scheduled.yml, off the merge path entirely (ADR-0026).
  security:
    name: "Gate 2 · Security"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action posts a PR summary comment; without these it fails on PR
    # events with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitLeaks needs full history

      # Hard failure on any detected secret — no continue-on-error.
      - name: GitLeaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 3: Tests ─────────────────────────────────────────────────────────
  tests:
    name: "Gate 3 · Tests + ArchUnit + Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Exposed to the pr-summary comment and the release notes (see Post-build jobs).
    outputs:
      tests_total: ${{ steps.summary.outputs.tests_total }}
      tests_passed: ${{ steps.summary.outputs.tests_passed }}
      tests_failed: ${{ steps.summary.outputs.tests_failed }}
      tests_skipped: ${{ steps.summary.outputs.tests_skipped }}
      coverage_pct: ${{ steps.summary.outputs.coverage_pct }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # tests is the cache WRITER (runs early on the critical path): it compiles the
      # whole project once and populates the Gradle build cache so the build job
      # reuses those compile/KSP outputs instead of recompiling cold.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # regressionCheck = every module's debug unit tests (ArchUnit + Robolectric live in the debug
      # variant) + the merged JaCoCo report + the coverage-floor gate. Coverage is JaCoCo, not Kover
      # (Kover's Android integration doesn't recognize AGP 9 variants — the same class of issue as
      # Hilt, ADR-0010). --continue runs all test tasks even if one fails (complete report); the job
      # still fails on any test failure OR a coverage-floor violation.
      - name: Regression suite (tests + ArchUnit + coverage floor)
        run: ./gradlew regressionCheck --continue

      # Always (re)generate the merged coverage report so the summary has data even when a test or the
      # coverage floor failed above (on failure, regressionCheck stops before the report task).
      - name: Aggregate coverage report
        if: always()
        run: ./gradlew jacocoAggregatedReport --continue

      # Parse JUnit + JaCoCo XML → GitHub Job Summary + regression-summary.md + job outputs
      # (test counts, coverage %) reused by the PR comment and the Release notes.
      - name: Build regression summary
        id: summary
        if: always()
        run: python3 scripts/ci/regression_summary.py

      - name: Upload test reports
        # always() ensures reports are uploaded even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoAggregatedReport/

      - name: Upload regression summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-summary
          path: regression-summary.md

  # ── Gate 4: Build (debug) ─────────────────────────────────────────────────
  # Validates compile + KSP + Compose on every PR and push. The signed RELEASE
  # build is NOT here — it is built in the `release` job below AFTER the version is
  # bumped, so the published APK carries the correct (bumped) versionName/versionCode.
  build:
    name: "Gate 4 · Build (debug)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ static-analysis, security, tests ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Reads the warm build cache populated by the tests job (read-only here).
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Assemble debug APK
        run: ./gradlew :apps:finance:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/finance/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ── Post-build: PR status summary (sticky comment) ────────────────────────
  # Posts/updates a single PR comment summarizing every gate's result, pass or
  # fail, so a clean run is visible too (previously only GitLeaks ever commented,
  # and only when it found a secret). Runs on pull_request only; never on push.
  pr-summary:
    name: "Post-build · PR Summary Comment"
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ static-analysis, security, tests, build ]
    permissions:
      pull-requests: write
    steps:
      # Mints a short-lived token for the "Dhruv CI Bot" GitHub App, so the comment
      # below is posted under that identity/avatar instead of github-actions[bot].
      # (The App's display name is "Dhruv CI Bot"; the secrets keep their DHRUV_BOT_* names.)
      # Requires the DHRUV_BOT_APP_ID / DHRUV_BOT_PRIVATE_KEY secrets (App not yet
      # installed, or secrets missing) — continue-on-error lets the script step's
      # `|| github.token` fallback below take over so commenting still works.
      - name: Mint Dhruv CI Bot token
        id: dhruv-bot
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.DHRUV_BOT_APP_ID }}
          private-key: ${{ secrets.DHRUV_BOT_PRIVATE_KEY }}

      - name: Post or update PR summary comment
        uses: actions/github-script@v7
        # Never let the comment itself block merge — e.g. a forked PR forces
        # GITHUB_TOKEN read-only regardless of the permissions block above.
        continue-on-error: true
        with:
          github-token: ${{ steps.dhruv-bot.outputs.token || github.token }}
          script: |
            const marker = '<!-- ci-pr-summary-comment -->';
            const icons = { success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' };
            const results = {
              staticAnalysis: '${{ needs.static-analysis.result }}',
              security: '${{ needs.security.result }}',
              tests: '${{ needs.tests.result }}',
              build: '${{ needs.build.result }}',
            };
            const rows = [
              ['Gate 1 · Static Analysis', icons[results.staticAnalysis] ?? '❔', results.staticAnalysis],
              ['Gate 2 · Security (GitLeaks)', icons[results.security] ?? '❔', results.security],
              ['Gate 2b · OWASP', 'ℹ️', 'scheduled scan (owasp-scheduled.yml)'],
              ['Gate 3 · Tests + ArchUnit + Coverage', icons[results.tests] ?? '❔', results.tests],
              ['Gate 4 · Build (debug)', icons[results.build] ?? '❔', results.build],
            ];
            const table = ['| Gate | Status | Result |', '|---|---|---|',
              ...rows.map(([n, i, r]) => `| ${n} | ${i} | ${r} |`)].join('\n');

            // Regression detail from the tests job outputs (empty on early failure → '?').
            const reg = {
              passed: '${{ needs.tests.outputs.tests_passed }}' || '?',
              failed: '${{ needs.tests.outputs.tests_failed }}' || '?',
              total: '${{ needs.tests.outputs.tests_total }}' || '?',
              skipped: '${{ needs.tests.outputs.tests_skipped }}' || '?',
              coverage: '${{ needs.tests.outputs.coverage_pct }}' || '?',
            };
            const failNote = (reg.failed !== '0' && reg.failed !== '?') ? `, **${reg.failed} failed**` : '';
            const regLine = `**Tests:** ${reg.passed}/${reg.total} passed${failNote}, ${reg.skipped} skipped · `
              + `**Coverage (line):** ${reg.coverage}%`;

            const overall = Object.values(results).includes('failure') ? '❌ Failing' : '✅ Passing';
            const body = [
              marker,
              `### CI Summary — ${overall}`,
              '',
              table,
              '',
              regLine,
              '',
              `_Commit: ${context.sha.substring(0, 7)} · Run: [#${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId}) · Posted by Dhruv CI Bot_`,
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
                });
              }
            } catch (err) {
              core.warning(`pr-summary: could not post/update comment: ${err.message}`);
            }

  # ── Post-build: Release (bump → build → tag → publish) ────────────────────
  # Runs only on push (not PRs) to develop/main after all 4 gates pass. Does the
  # whole release IN THIS RUN so it cannot silently half-complete:
  #   1. Bump patch version (MAJOR.MINOR.PATCH+1) in platform/versions.json +
  #      VERSION_CODE/VERSION_NAME in gradle.properties.
  #   2. Build the SIGNED release APK *at the bumped version* (gradle reads the just-
  #      written gradle.properties), and verify it is signed and within the size budget.
  #   3. Commit the bump back with [skip ci]; create + push the dhruv-<app>-v<version> tag.
  #   4. Publish a GitHub Release with the APK attached.
  #
  # No RELEASE_TOKEN / cross-workflow trigger needed: creating a Release with the
  # default GITHUB_TOKEN works fine (the anti-recursion rule only blocks a pushed
  # tag from *triggering* another workflow, which we no longer rely on). Do NOT set
  # RELEASE_TOKEN — release.yml would then also fire on the tag and double-publish.
  release:
    name: "Post-build · Release (bump + build + publish)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build ]
    # Skip on PRs and on commits that were themselves made by this job
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write  # push bump commit + tag, create GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Bump version files ──────────────────────────────────────────
      - name: Increment VERSION_CODE in gradle.properties
        id: bump
        run: |
          PROPS="gradle.properties"
          CURRENT=$(grep "^VERSION_CODE=" "$PROPS" 2>/dev/null | cut -d= -f2 || echo "0")
          NEW=$((CURRENT + 1))

          if grep -q "^VERSION_CODE=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW/" "$PROPS"
          else
            echo "VERSION_CODE=$NEW" >> "$PROPS"
          fi

          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE bumped: $CURRENT → $NEW"

      - name: Bump patch version and buildNumber in platform/versions.json
        id: version_json
        run: |
          NEW_CODE="${{ steps.bump.outputs.new }}"
          python3 - <<PYEOF
          import json

          with open("platform/versions.json") as f:
              data = json.load(f)

          first_version = None
          for app, meta in data.get("apps", {}).items():
              if meta.get("status") in ("planned", "future"):
                  continue
              # Auto-increment patch: MAJOR.MINOR.PATCH → MAJOR.MINOR.PATCH+1
              parts = meta["version"].split(".")
              parts[2] = str(int(parts[2]) + 1)
              meta["version"] = ".".join(parts)
              meta["buildNumber"] = int("$NEW_CODE")
              if first_version is None:
                  first_version = meta["version"]

          with open("platform/versions.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open("/tmp/new_version.txt", "w") as f:
              f.write(first_version or "")
          PYEOF
          NEW_VERSION=$(cat /tmp/new_version.txt)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "platform/versions.json updated (version=$NEW_VERSION, buildNumber=$NEW_CODE)"

      - name: Update VERSION_NAME in gradle.properties
        run: |
          NEW_VERSION="${{ steps.version_json.outputs.version }}"
          PROPS="gradle.properties"
          if grep -q "^VERSION_NAME=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION/" "$PROPS"
          else
            echo "VERSION_NAME=$NEW_VERSION" >> "$PROPS"
          fi
          echo "VERSION_NAME updated to $NEW_VERSION"

      # ── 2. Build the SIGNED release APK at the bumped version ───────────
      # gradle reads VERSION_CODE/VERSION_NAME from the gradle.properties just
      # written above, so the APK carries the correct version. Built BEFORE any
      # push/tag so a build failure aborts the release cleanly (no orphan tag).
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/upload-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Assemble signed release APK
        run: ./gradlew :apps:finance:app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Locate + VERIFY the APK: must exist, must be signed (no *-unsigned*), must
      # be within the 50 MB budget. Failing here aborts before any tag/release, so
      # we never publish a release with a missing or unsigned APK.
      - name: Locate and verify signed APK
        id: apk
        run: |
          DIR="apps/finance/app/build/outputs/apk/release"
          APK=$(find "$DIR" -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No signed release APK found in $DIR" >&2
            find "$DIR" -name "*.apk" -printf '  present: %p\n' 2>/dev/null || true
            exit 1
          fi
          VERSION="${{ steps.version_json.outputs.version }}"
          DEST="dhruv-finance-v${VERSION}-release.apk"
          cp "$APK" "$DEST"
          SIZE_MB=$(du -m "$DEST" | cut -f1)
          echo "Release APK: $DEST (${SIZE_MB} MB)"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "❌ APK exceeds 50 MB limit (${SIZE_MB} MB)" >&2
            exit 1
          fi
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "✅ Signed APK verified within size budget"

      # ── 3. Commit the bump + create/push the tag ───────────────────────
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle.properties platform/versions.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping push."
            exit 0
          fi

          git commit -m "chore: auto-bump to v${{ steps.version_json.outputs.version }} (versionCode=${{ steps.bump.outputs.new }}) [skip ci]"
          # --force-with-lease: safe push — aborts if the remote moved ahead of us
          git push --force-with-lease origin HEAD:${{ github.ref_name }}

      # Tag points at the bump commit just pushed. Idempotent: skip if it exists
      # (same version reused when develop is promoted to main → no duplicate tag).
      - name: Resolve release tag (finance)
        id: tagname
        run: echo "tag=dhruv-finance-v${{ steps.version_json.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create & push version tag (idempotent)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet || true
          TAG="${{ steps.tagname.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "↺ ${TAG} already exists — not re-tagging."
          else
            git tag -a "${TAG}" -m "Release ${TAG} (from ${{ github.ref_name }} @ ${GITHUB_SHA::7})"
            git push origin "refs/tags/${TAG}"
            echo "✅ Created and pushed ${TAG}."
          fi

      # ── 4. Attach the regression summary + coverage to the Release ──────
      # Every merge to develop/main is a push and produces a Release, so this is where the
      # merge's test totals + coverage % become durably visible (PR comments don't fire on push).
      # The artifacts were uploaded by the `tests` job earlier in THIS run; downloads are
      # best-effort so a missing artifact never blocks the release.
      - name: Download regression summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: regression-summary
          path: .ci-summary

      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: .ci-coverage

      - name: Compose release notes + zip coverage
        run: |
          {
            if [ -f .ci-summary/regression-summary.md ]; then
              cat .ci-summary/regression-summary.md
              echo ""
            fi
            echo "_APK: \`${{ steps.apk.outputs.path }}\`. Full HTML coverage report attached below._"
          } > release-body.md
          if [ -d .ci-coverage ]; then
            (cd .ci-coverage && zip -qr ../coverage-report.zip .) || echo "coverage zip skipped"
          fi

      # ── 5. Publish the GitHub Release ───────────────────────────────────
      # The APK's existence is already guaranteed by the verify step above, so
      # fail_on_unmatched_files is off here only so that a best-effort coverage-report.zip
      # (nice-to-have) can be absent without blocking the release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: "Dhruv finance ${{ steps.version_json.outputs.version }}"
          body_path: release-body.md
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            coverage-report.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
