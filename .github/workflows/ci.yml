name: CI

on:
  # Feature branches (feat/**, fix/**, chore/**) are validated via their PR below,
  # not on push — pushing a branch that already has an open PR would otherwise run
  # the pipeline twice (once per event) on the same commit.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Skip if the commit was made by the version-bump job itself
# (the job adds [skip ci] to its message, but this is a belt-and-suspenders guard).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  # ── Gate 1: Static analysis ────────────────────────────────────────────────
  static-analysis:
    name: "Gate 1 · Static Analysis"
    # TEMP: Gate 1 disabled — ktlint/detekt/lint remediation pending.
    # Re-enable by deleting this `if` and restoring it to the build job's `needs`.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Download ktlint binary directly — no third-party action dependency.
      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint

      # Fails the job (non-zero exit) on any style violation.
      - name: ktlint check
        run: |
          ./ktlint \
            --reporter=plain \
            --reporter=checkstyle,output=build/reports/ktlint/ktlint.xml \
            "apps/**/*.kt" "libs/**/*.kt" "build-logic/**/*.kt"

      # No --continue: first detekt violation fails the step immediately.
      - name: Detekt
        run: ./gradlew detekt

      # Lint runs on the debug variant; non-zero exit on errors (not warnings).
      - name: Android Lint
        run: ./gradlew :apps:finance:app:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt/*.html
            build/reports/ktlint/ktlint.xml

  # ── Gate 2: Security scan ─────────────────────────────────────────────────
  security:
    name: "Gate 2 · Security"
    runs-on: ubuntu-latest
    # gitleaks-action posts a PR summary comment; without these it fails on PR
    # events with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitLeaks needs full history

      # Hard failure on any detected secret — no continue-on-error.
      - name: GitLeaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      # OWASP: warn-only until the dependency-check plugin is wired in build-logic.
      # Flip continue-on-error to false once the plugin is configured.
      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: "**/build/reports/dependency-check-report.html"

  # ── Gate 3: Tests ─────────────────────────────────────────────────────────
  tests:
    name: "Gate 3 · Tests + ArchUnit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      # --continue: run all test tasks across all modules even if one fails,
      # so we get a complete failure report. The job still fails (non-zero exit).
      - name: Unit tests + ArchUnit
        run: ./gradlew test --continue

      - name: Upload test reports
        # always() ensures reports are uploaded even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  # ── Gate 4: Build ─────────────────────────────────────────────────────────
  build:
    name: "Gate 4 · Build + APK size"
    runs-on: ubuntu-latest
    needs: [ security, tests ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/upload-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Assemble debug APK
        run: ./gradlew :apps:finance:app:assembleDebug

      - name: Assemble release APK (signed)
        run: ./gradlew :apps:finance:app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: APK size guard (fail if > 50 MB)
        run: |
          APK=$(find apps/finance/app/build/outputs/apk/release -name "*.apk" | head -1)
          SIZE_MB=$(du -m "$APK" | cut -f1)
          echo "Release APK size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "❌ APK exceeds 50 MB limit (${SIZE_MB} MB)"
            exit 1
          fi
          echo "✅ APK within size limit"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            apps/finance/app/build/outputs/apk/debug/*.apk
            apps/finance/app/build/outputs/apk/release/*.apk
          retention-days: 7

  # ── Post-build: auto-bump version ────────────────────────────────────────
  # Runs only on push (not PRs) to develop/main after all 4 gates pass.
  # Increments the patch version (MAJOR.MINOR.PATCH+1) in platform/versions.json,
  # syncs VERSION_CODE + VERSION_NAME in gradle.properties, then commits back with
  # [skip ci] so this commit does not re-trigger the pipeline.
  version-bump:
    name: "Post-build · Bump version"
    runs-on: ubuntu-latest
    needs: [ build ]
    # Skip on PRs and on commits that were themselves made by this job
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the branch head so we can push back to it
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. gradle.properties — VERSION_CODE ────────────────────────────
      - name: Increment VERSION_CODE in gradle.properties
        id: bump
        run: |
          PROPS="gradle.properties"
          CURRENT=$(grep "^VERSION_CODE=" "$PROPS" 2>/dev/null | cut -d= -f2 || echo "0")
          NEW=$((CURRENT + 1))

          if grep -q "^VERSION_CODE=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW/" "$PROPS"
          else
            echo "VERSION_CODE=$NEW" >> "$PROPS"
          fi

          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE bumped: $CURRENT → $NEW"

      # ── 2. platform/versions.json — auto-increment patch + buildNumber ──
      - name: Bump patch version and buildNumber in platform/versions.json
        id: version_json
        run: |
          NEW_CODE="${{ steps.bump.outputs.new }}"
          python3 - <<PYEOF
          import json

          with open("platform/versions.json") as f:
              data = json.load(f)

          first_version = None
          for app, meta in data.get("apps", {}).items():
              if meta.get("status") in ("planned", "future"):
                  continue
              # Auto-increment patch: MAJOR.MINOR.PATCH → MAJOR.MINOR.PATCH+1
              parts = meta["version"].split(".")
              parts[2] = str(int(parts[2]) + 1)
              meta["version"] = ".".join(parts)
              meta["buildNumber"] = int("$NEW_CODE")
              if first_version is None:
                  first_version = meta["version"]

          with open("platform/versions.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open("/tmp/new_version.txt", "w") as f:
              f.write(first_version or "")
          PYEOF
          NEW_VERSION=$(cat /tmp/new_version.txt)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "platform/versions.json updated (version=$NEW_VERSION, buildNumber=$NEW_CODE)"

      # ── 2b. gradle.properties — sync VERSION_NAME ──────────────────────
      - name: Update VERSION_NAME in gradle.properties
        run: |
          NEW_VERSION="${{ steps.version_json.outputs.version }}"
          PROPS="gradle.properties"
          if grep -q "^VERSION_NAME=" "$PROPS" 2>/dev/null; then
            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION/" "$PROPS"
          else
            echo "VERSION_NAME=$NEW_VERSION" >> "$PROPS"
          fi
          echo "VERSION_NAME updated to $NEW_VERSION"

      # ── 3. Commit and push all three files back ─────────────────────────
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gradle.properties platform/versions.json

          # Bail gracefully if nothing changed (idempotent re-runs)
          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping push."
            exit 0
          fi

          git commit -m "chore: auto-bump to v${{ steps.version_json.outputs.version }} (versionCode=${{ steps.bump.outputs.new }}) [skip ci]"

          # --force-with-lease: safe push — aborts if the remote moved ahead of us
          git push --force-with-lease origin HEAD:${{ github.ref_name }}

  # ── Post-build: auto-tag the release version ──────────────────────────────
  # Runs after the versionCode bump on a push (merge) to develop/main. Reads the
  # semantic version from platform/versions.json and creates `dhruv-<app>-v<version>`
  # for every active app — IDEMPOTENTLY: the tag is created once (typically on the
  # develop merge) and the same version is reused when develop is promoted to main,
  # so develop and main always carry the SAME version tag (never a duplicate/clash).
  # Pushing the tag triggers the Release workflow (APK on develop; AAB on main is deferred).
  #
  # IMPORTANT: a tag pushed with the default GITHUB_TOKEN does NOT trigger other
  # workflows (GitHub's anti-recursion rule), so Release would not fire. Provide a PAT
  # in the `RELEASE_TOKEN` secret (repo + workflow scope). Without it we fall back to
  # GITHUB_TOKEN — the tag is still created, but you must run Release manually.
  auto-tag:
    name: "Post-build · Auto-tag version"
    runs-on: ubuntu-latest
    needs: [ version-bump ]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Branch head — includes the versionCode bump commit just pushed by version-bump.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Derive one tag per active (non-planned/future) app from the source-of-truth version file.
      - name: Resolve release tags from platform/versions.json
        run: |
          python3 - <<'PYEOF' > tags.txt
          import json
          data = json.load(open("platform/versions.json"))
          for app, meta in data.get("apps", {}).items():
              if meta.get("status") in ("planned", "future"):
                  continue
              print(f"dhruv-{app}-v{meta['version']}")
          PYEOF
          echo "Resolved release tags:"; cat tags.txt

      # Create + push each tag only if it does not already exist (same version → no re-tag).
      - name: Create & push version tags (idempotent)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet || true
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "↺ ${TAG} already exists — same version reused on ${{ github.ref_name }}, not re-tagging."
              continue
            fi
            git tag -a "${TAG}" -m "Release ${TAG} (auto-tagged from ${{ github.ref_name }} @ ${GITHUB_SHA::7})"
            git push origin "refs/tags/${TAG}"
            echo "✅ Created and pushed ${TAG} → triggers Release workflow."
          done < tags.txt
