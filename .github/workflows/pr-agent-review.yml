name: PR Module Compliance

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  module-audit:
    name: Module Compliance Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed feature modules
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          MODULES=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^apps/[^/]+/feature/' \
            | sed -E 's|^(apps/[^/]+/feature/[^/]+)/.*|\1|' \
            | sort -u)
          echo "modules<<EOF" >> $GITHUB_OUTPUT
          echo "$MODULES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=$([ -n "$MODULES" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Run compliance checks
        if: steps.changed.outputs.has_changes == 'true'
        id: audit
        run: |
          MODULES="${{ steps.changed.outputs.modules }}"
          PASS=0
          FAIL=0
          REPORT="## Module Compliance Audit — PR #${{ github.event.pull_request.number }}\n\n"
          REPORT+="| Module | FeatureHost | Feature Flag | Koin Module | No Secret Keys | Status |\n"
          REPORT+="|--------|-------------|--------------|-------------|----------------|--------|\n"

          for MODULE in $MODULES; do
            APP=$(echo "$MODULE" | cut -d/ -f2)
            MOD_NAME=$(echo "$MODULE" | cut -d/ -f4)
            ISSUES=""
            COL_FH="✅" COL_FF="✅" COL_KOIN="✅" COL_SEC="✅"

            # Check 1: FeatureHost wrapping
            if ! grep -rq "FeatureHost" "$MODULE/" 2>/dev/null; then
              COL_FH="❌"; ISSUES+=" missing FeatureHost;"
            fi

            # Check 2: Feature flag entry
            FLAG_FILE="platform/feature-flags/$APP.json"
            if [ ! -f "$FLAG_FILE" ] || ! grep -q "\"$MOD_NAME\"" "$FLAG_FILE" 2>/dev/null; then
              COL_FF="❌"; ISSUES+=" missing feature flag in $FLAG_FILE;"
            fi

            # Check 3: Koin module declaration
            if ! grep -rq "fun.*[Mm]odule\(\)" "$MODULE/" 2>/dev/null && \
               ! grep -rq "val.*[Mm]odule.*=.*module" "$MODULE/" 2>/dev/null; then
              COL_KOIN="❌"; ISSUES+=" no Koin module declared;"
            fi

            # Check 4: No hardcoded API keys
            if grep -rE "(api_key|apiKey|API_KEY|sk-ant-|AIza)['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\-]{10,}" \
               "$MODULE/" 2>/dev/null | grep -v "BuildConfig\|secrets\|//"; then
              COL_SEC="❌"; ISSUES+=" possible hardcoded secret;"
            fi

            if [ -z "$ISSUES" ]; then
              STATUS="✅ PASS"
              PASS=$((PASS+1))
            else
              STATUS="❌ FAIL"
              FAIL=$((FAIL+1))
            fi

            REPORT+="| \`$MODULE\` | $COL_FH | $COL_FF | $COL_KOIN | $COL_SEC | $STATUS |\n"
            [ -n "$ISSUES" ] && REPORT+="|  | _$ISSUES_ | | | | |\n"
          done

          if [ "$FAIL" -eq 0 ]; then
            REPORT+="\n**All checks passed.** ✅"
          else
            REPORT+="\n**$PASS passed, $FAIL failed.** Please review and resolve the violations above before merging."
          fi
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "failed=$FAIL" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.audit.outputs.report }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

