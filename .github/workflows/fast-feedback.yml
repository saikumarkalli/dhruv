name: Fast Feedback

# Quick validation on every feature-branch commit (pre-PR feedback). Deliberately
# LIGHTWEIGHT: compile the debug variant + run debug unit tests (incl. ArchUnit).
# It does NOT run OWASP, signing, the release build, version bump, or tagging — those
# belong to the full CI gate (ci.yml) on the PR and on merge to develop/main.
#
# Why a separate workflow: ci.yml intentionally does not trigger on feature-branch
# pushes, so feature work got no feedback until a PR was opened. This closes that gap
# cheaply. Once a PR is open, ci.yml (pull_request) is the authoritative merge gate;
# this fast run is just early signal and is auto-cancelled as you push new commits.
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      # spec-kit (.specify/) auto-creates unprefixed NNN-slug branches (no feat/ prefix
      # option in create-new-feature.ps1) — matched here so those get the same pre-PR signal.
      - '[0-9][0-9][0-9]-**'
  workflow_dispatch:

# Cancel superseded runs on the same branch — feature work is pushed rapidly and only
# the latest commit needs validating. (Safe to cancel: this is not a release path.)
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: "21"
  # gradle.properties keeps workers.max=4 for dev machines. GitHub-hosted standard
  # runners on a private repo are 2-core/7 GB, so four workers just thrash. Overridden
  # here (CI only) — the daemon and configuration cache settings stay as configured.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"

jobs:
  # Once a PR is open for this branch, ci.yml's pull_request run is the authoritative
  # build — running fast-feedback too would compile and test the same commit twice
  # (ADR-0026). This job costs seconds and gates the expensive one below.
  pr-check:
    name: "Open PR check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      open: ${{ steps.pr.outputs.open }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
                  --state open --json number --jq 'length' 2>/dev/null || echo "0")
          echo "open=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Open PRs for $GITHUB_REF_NAME: $COUNT"

  compile-and-test:
    name: "Compile + unit tests (debug)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pr-check
    if: needs.pr-check.outputs.open == '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Read-only: reuse the build cache populated by develop/main runs for fast warm
      # builds, without letting transient feature-branch outputs write to the shared cache.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      # Debug compile + debug unit tests + ArchUnit in a single invocation.
      # --continue: surface all failures across modules in one run.
      - name: Assemble debug + unit tests
        run: ./gradlew :apps:finance:app:assembleDebug testDebugUnitTest --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-feedback-test-reports
          path: "**/build/reports/tests/"
          retention-days: 3
